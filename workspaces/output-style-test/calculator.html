<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator {
            background: #222;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 320px;
            overflow: hidden;
        }

        .display {
            background: #111;
            color: #fff;
            font-size: 48px;
            font-weight: 300;
            padding: 30px 20px;
            text-align: right;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            word-wrap: break-word;
            word-break: break-all;
        }

        .display-previous {
            color: #666;
            font-size: 24px;
            margin-bottom: 10px;
            min-height: 30px;
        }

        .display-current {
            font-size: 40px;
            min-height: 50px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: #333;
            padding: 1px;
        }

        button {
            padding: 20px;
            border: none;
            background: #404040;
            color: #fff;
            font-size: 24px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #505050;
        }

        button:active {
            background: #606060;
        }

        button.operator {
            background: #667eea;
        }

        button.operator:hover {
            background: #5568d3;
        }

        button.operator:active {
            background: #4a56b8;
        }

        button.equals {
            background: #4caf50;
            grid-column: span 2;
        }

        button.equals:hover {
            background: #45a049;
        }

        button.equals:active {
            background: #3d8b40;
        }

        button.clear {
            background: #ff6b6b;
        }

        button.clear:hover {
            background: #ee5a52;
        }

        button.clear:active {
            background: #dd4940;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="display-previous" id="previous"></div>
            <div class="display-current" id="current">0</div>
        </div>
        <div class="buttons">
            <button class="clear" onclick="clearCalculator()">C</button>
            <button class="operator" onclick="handleOperator('/')">&divide;</button>
            <button class="operator" onclick="handleOperator('*')">&times;</button>
            <button class="operator" onclick="handleOperator('-')">−</button>

            <button onclick="handleNumber('7')">7</button>
            <button onclick="handleNumber('8')">8</button>
            <button onclick="handleNumber('9')">9</button>
            <button class="operator" onclick="handleOperator('+')">+</button>

            <button onclick="handleNumber('4')">4</button>
            <button onclick="handleNumber('5')">5</button>
            <button onclick="handleNumber('6')">6</button>
            <button class="operator" onclick="handleOperator('=')">=</button>

            <button onclick="handleNumber('1')">1</button>
            <button onclick="handleNumber('2')">2</button>
            <button onclick="handleNumber('3')">3</button>
            <button class="operator" onclick="handleOperator('=')">=</button>

            <button onclick="handleNumber('0')" style="grid-column: span 2;">0</button>
            <button onclick="handleNumber('.')">.</button>
            <button class="equals" onclick="calculateResult()">=</button>
        </div>
    </div>

    <script>
        let currentValue = '0';
        let previousValue = '';
        let operation = null;
        let shouldResetDisplay = false;

        const currentDisplay = document.getElementById('current');
        const previousDisplay = document.getElementById('previous');

        function updateDisplay() {
            currentDisplay.textContent = currentValue || '0';
            previousDisplay.textContent = previousValue + (operation ? ' ' + operation : '');
        }

        function handleNumber(num) {
            if (shouldResetDisplay) {
                currentValue = num;
                shouldResetDisplay = false;
            } else {
                currentValue = currentValue === '0' && num !== '.' ? num : currentValue + num;
            }
            updateDisplay();
        }

        function handleOperator(op) {
            if (op === '=') {
                calculateResult();
            } else {
                if (previousValue && operation && !shouldResetDisplay) {
                    calculateResult();
                }
                operation = op;
                previousValue = currentValue;
                shouldResetDisplay = true;
                updateDisplay();
            }
        }

        function calculateResult() {
            if (!operation || !previousValue) return;

            const prev = parseFloat(previousValue);
            const current = parseFloat(currentValue);
            let result;

            switch (operation) {
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '*':
                    result = prev * current;
                    break;
                case '/':
                    result = current !== 0 ? prev / current : 0; // 0 나누기 방지
                    break;
                default:
                    return;
            }

            // 부동소수점 오차 보정
            currentValue = Math.round(result * 10000000000) / 10000000000;
            currentValue = currentValue.toString();
            operation = null;
            previousValue = '';
            shouldResetDisplay = true;
            updateDisplay();
        }

        function clearCalculator() {
            currentValue = '0';
            previousValue = '';
            operation = null;
            shouldResetDisplay = false;
            updateDisplay();
        }

        updateDisplay();
    </script>
</body>
</html>
